[project]
name = "plant-protection-agent"
version = "0.1.0"
description = "基于 LangGraph 的多模态、多 Skill、可追问、可仲裁、可安全约束的植保专业智能体"
requires-python = ">=3.11"
dependencies = [
    "langgraph>=0.4.0",
    "langchain-core>=0.3.0",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
]
vlm = [
    "Pillow>=10.0.0",
]
api = [
    "fastapi>=0.115.0",
    "uvicorn>=0.32.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "eval/*.py"]

[build-system]
requires = ["setuptools>=75.0.0"]
build-backend = "setuptools.build_meta"
